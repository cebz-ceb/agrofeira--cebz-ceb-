<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Produtor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rancho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="estilo.css">
  </head>
  <body>
    <a class="pular" href="#main">Pular para o conteúdo</a>
    <header class="cabecalho-site">
      <h1>AgroFeira Paragominas</h1>
      <nav aria-label="Principal">
        <ul class="menu">
          <li><a href="index.html">Página Inicial</a></li>
          <li><a href="safra.html">Safra</a></li>
          <li><a href="cadastro-produtor.html" aria-current="page">Cadastro de Produtor</a></li>
          <li><a href="sobre.html">Sobre</a></li>
        </ul>
      </nav>
    </header>
    <main id="main">
      <h2>Formulário de Cadastro de Produtor</h2>
        <form class="formulario-cadastro">
            <fieldset>
                <legend>Quem é você</legend>
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required autocomplete="name">

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="email">

                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" autocomplete="tel">

                    <label for="caf">Número do CAF</label>
                    <input type="text" id="caf" name="caf">

                    <label for="cep">CEP da Propriedade</label>
                    <input type="text" id="cep" name="cep" inputmode="numeric" pattern="\d{5}-?\d{3}" aria-describedby="ajuda-cep">
                    <p id="ajuda-cep">Formato: 00000-000</p>
            </fieldset>

            <fieldset>
                <legend>O que você vende</legend>
                    <label for="produto">Produto Principal</label>
                        <select id="produto" name="produto" required>
                            <option value="">Escolha um Produto</option>
                            <option>Mandioca</option>
                            <option>Banana-prata</option>
                            <option>Açaí</option>
                            <option>Pimenta-do-Reino</option>
                            <option>Cupuaçu</option>
                            <option>Alface</option>
                        </select>
                    
                    <label for="quant">Quantidade por Semana</label>
                    <input type="number" id="quant" name="quant" required min="1" max="500" step="1">

                    <label for="entrega">Começa a Entregar em:</label>
                    <input type="date" id="entrega" name="entrega">

                    <fieldset>
                        <legend>Como entrega?</legend>
                        <label for="feira">Leva à Feira</label>
                        <input type="radio" id="feira" name="como-entrega" value="feira">
                        <label for="propriedade">A feira retira na propriedade</label>
                        <input type="radio" id="propriedade" name="como-entrega" value="propriedade">
                    </fieldset>

                    <label for="obs">Observações</label>
                    <textarea id="obs" name="obs" rows="10"></textarea>

                    <label for="aceite">Li e aceito as regras da feira</label>
                    <input type="checkbox" id="aceite" name="aceite" required>

                    <button type="submit">Enviar Formulário</button>
            </fieldset>
        </form>
        <p role="status" aria-live="polite"></p>
    </main>
    <footer class="rodape-site">
      <p>Agricultura familiar de Paragominas</p>
      <p>Por Thiago Araujo</p>
    </footer>
  </body>
</html>
